<title>Unit Bersama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style id="css">
/* Konsep: etalase showroom. Pita gelap berisi foto dan ajakan bertindak, badan halaman terang, satu aksen amber untuk tombol utama */
:root{
  --bg:#FAF8F4;--surface:#FFFFFF;--surface-2:#F1EDE4;--stage:#ECE7DB;
  --text:#15181D;--muted:#555B63;--line:#E2DCCD;
  --accent:#8F5A00;--accent-ink:#FFFFFF;--cta:#F5B000;--cta-ink:#15181D;
  --info:#2B5FA8;--dp-tint:#F6E7BD;--danger:#B3261E;--ok:#1F7A4D;
  --band:#12151A;--band-2:#1B1F26;--band-ink:#F4F1EA;--band-muted:#B4BAC2;--band-line:#2E343D;--band-accent:#F5B94A;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 12px 28px -16px rgba(20,24,29,.3);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114;--surface:#171A1F;--surface-2:#1E2228;--stage:#1E2228;
    --text:#F1EEE7;--muted:#A9AFB7;--line:#2A2F37;
    --accent:#F0B84A;--accent-ink:#14110F;--cta:#F5B000;--cta-ink:#15181D;
    --info:#8DB6EE;--dp-tint:#3A3220;--danger:#F2877F;--ok:#5CC38F;
    --band:#090B0D;--band-2:#15181D;--band-ink:#F4F1EA;--band-muted:#B4BAC2;--band-line:#2A2F37;--band-accent:#F5B94A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114;--surface:#171A1F;--surface-2:#1E2228;--stage:#1E2228;
  --text:#F1EEE7;--muted:#A9AFB7;--line:#2A2F37;
  --accent:#F0B84A;--accent-ink:#14110F;--cta:#F5B000;--cta-ink:#15181D;
  --info:#8DB6EE;--dp-tint:#3A3220;--danger:#F2877F;--ok:#5CC38F;
  --band:#090B0D;--band-2:#15181D;--band-ink:#F4F1EA;--band-muted:#B4BAC2;--band-line:#2A2F37;--band-accent:#F5B94A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--body);padding-bottom:64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4,p,dl,dd,ul{margin:0}
h1,h2,h3,h4{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.sp{flex:1 1 auto}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:600 15px var(--body);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.x{flex:none;width:44px;height:44px;border-radius:999px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}

/* admin bar */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px}
.abar.on{border-bottom:2px solid var(--accent)}
.abin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px}
.dirty{color:var(--accent);font-weight:600}

/* header & hero */
.top{border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:18px}
.logo{font:700 22px var(--display);letter-spacing:.08em;text-transform:uppercase}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:32px 56px;padding-block:clamp(28px,6vw,64px) clamp(24px,4vw,40px)}
.hero>div{flex:1 1 420px;min-width:0}
.hero>.hs{flex:1 1 340px;max-width:560px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font:700 clamp(48px,8vw,88px)/.95 var(--display);letter-spacing:.01em;text-transform:uppercase;margin-top:12px}
.lead{margin-top:20px;max-width:520px;font-size:18px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:20px 40px;margin-top:32px}
.stat b{display:block;font:600 34px/1 var(--display);color:var(--accent)}
.stat span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.hstage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:20px;padding:36px 24px 12px}

/* langkah */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px 32px;border-block:1px solid var(--line);padding-block:24px}
.step{display:flex;gap:14px;align-items:flex-start}
.step i{font:700 32px/1 var(--display);color:var(--accent);font-style:normal}
.step b{display:block;font-weight:600}
.step span{display:block;font-size:14px;color:var(--muted)}

/* bagian */
.sec{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.sec .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font:700 18px var(--display)}
h2{font:600 30px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sec small{font-size:14px;color:var(--muted)}
.gap{margin-top:44px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.tier{display:block;width:100%;text-align:left;padding:20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.tier[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.tier .nm{display:flex;justify-content:space-between;gap:8px;font:600 20px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tier .nm em{font:600 13px var(--body);font-style:normal;letter-spacing:0;text-transform:none;color:var(--accent)}
.tier .tt{display:block;margin-top:8px;font:700 38px/1.05 var(--display)}
.tier .ss{display:block;font-size:14px;color:var(--muted)}
.tier .pp{display:block;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-weight:600}
.tier .pp span,.tier .cc{font-weight:400;color:var(--muted);font-size:14px}
.tier .cc{display:block;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:500;font-size:15px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill span{margin-left:8px;opacity:.8}
.note{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--muted);border-radius:12px;padding:14px 18px;font-size:14px;margin-top:16px}
.note svg{flex:none;margin-top:2px;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;list-style:none;padding:0;margin-top:16px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.grp{margin-top:40px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.gh h3{font:600 30px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.gh span{font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage{position:relative;background:var(--stage);padding:40px 16px 10px}
.stage svg,.hstage svg{display:block;width:100%;height:auto}
.tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--muted);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stage.ph{padding:0}
.mimg{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--surface-2)}
.ph .tag{background:rgba(0,0,0,.6);color:#fff;border-color:rgba(255,255,255,.7)}
.hstage.ph{padding:0;overflow:hidden}
.dt>.l .mimg{border-radius:12px}
.imgprev{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}
.imgprev .mimg{max-width:320px;border-radius:10px;border:1px solid var(--line)}
input[type=file]{padding:8px 12px}
.cb{display:flex;flex-direction:column;gap:14px;padding:18px 20px 20px;flex:1}
.cb .mt{font-size:13px;color:var(--muted)}
.cb h4{font:600 28px/1.1 var(--display);margin-top:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;text-align:right}
.kv dd.ac{color:var(--accent);font-weight:700}
.sl{display:flex;flex-direction:column;gap:8px}
.sl .lb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:13px;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:10px}
.mem{--st:var(--muted);position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--st);font:600 15px var(--display);letter-spacing:.04em;color:var(--text);padding:0;cursor:default}
button.mem{cursor:pointer}
.mem.st-daftar{--st:var(--muted);border-style:dashed}
.mem.st-verifikasi{--st:var(--info)}
.mem.st-dp{--st:var(--accent);background:var(--dp-tint)}
.mem.empty{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);font-size:20px;opacity:.65}
button.mem.empty{opacity:1}
.bdg{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--st);border:1.5px solid var(--st)}
.bdg svg{display:block}
.lg{--st:var(--muted);position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--st);border:1.5px solid var(--st)}
.lg.st-verifikasi{--st:var(--info)}
.lg.st-dp{--st:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.acts .btn{flex:1 1 120px}
.empty-state{padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13px;color:var(--muted)}
.foot p{max-width:720px}

/* dialog */
dialog{width:min(920px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);overflow:auto}
dialog.narrow{width:min(560px,calc(100vw - 32px))}
dialog:not([open]){display:none}
dialog::backdrop{background:rgba(8,9,10,.72)}
.dt{display:flex;flex-wrap:wrap}
.dt>.l{flex:1 1 340px;min-width:0;background:var(--stage);padding:28px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.dt>.r{flex:1 1 380px;min-width:0;padding:28px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dh .mt{font-size:13px;color:var(--muted)}
.dh h2{font:700 38px/1.05 var(--display);text-transform:none;letter-spacing:0;margin-top:2px}
.dh .tr{margin-top:6px;font-size:14px;color:var(--accent);font-weight:600}
.dt h3{font:600 20px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.dt .kv{font-size:15px}
.dt .kv.sm{font-size:14px}
.box{margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px}
.box b{display:block;margin-bottom:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btns .btn{flex:1 1 180px}
.frm{padding:24px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:14px;font-weight:600}
.fld small{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text)}
textarea{resize:vertical}
.err{margin-top:14px;color:var(--danger);font-size:14px;font-weight:600}
.frow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}.dh h2{font-size:32px}}
/* ===== situs berhalaman ===== */
.logo{color:var(--text);text-decoration:none}
h1[tabindex="-1"]:focus{outline:none}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{color:var(--text)}
@media (max-width:560px){.nav a{padding:0 10px;font-size:14px}}
.nav a[aria-current="page"]{color:var(--text);border-color:var(--accent);background:var(--surface-2)}
.by{margin-top:20px;font-size:14px;color:var(--muted)}
.by a,.lead a,.tl a,.ans a,.ut a,.fine a,.pi a,.pc p a,.rows a,.prose a,.fo a,.stlist a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.phead{padding-block:clamp(28px,5vw,52px) 0}
.phead h1{font-size:clamp(40px,6.5vw,68px);margin-top:10px}
.phead .lead{max-width:640px}
.blk{margin-top:44px}
.blk>.sec{margin-bottom:14px}
.ut{white-space:pre-line}
.prose{max-width:680px}
.prose p+p{margin-top:12px}
.fine{margin-top:32px;font-size:13px;color:var(--muted);max-width:760px}

/* linimasa */
.tl{list-style:none;margin:0;padding:0;counter-reset:s}
.tl li{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding-bottom:26px}
.tl li::before{counter-increment:s;content:counter(s);position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font:700 22px var(--display)}
.tl li::after{content:"";position:absolute;left:21.25px;top:46px;bottom:2px;width:1.5px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl h3{font:600 22px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase;padding-top:9px}
.tl p{margin-top:4px;color:var(--muted);font-size:15px;max-width:640px}

/* kartu & daftar */
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.pc{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none}
.pc h3{font:600 22px/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase}
.pc p{margin-top:6px;color:var(--muted);font-size:15px}
a.pc:hover{border-color:var(--accent)}
.pc .go{display:inline-block;margin-top:10px;color:var(--accent);font-weight:600;font-size:14px}
.stlist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.stlist li{display:flex;gap:14px;align-items:flex-start}
.stlist .lg{flex:none;width:26px;height:26px;margin-top:1px}
.stlist b{display:block}
.stlist span:not(.lg){display:block;color:var(--muted);font-size:15px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:760px}
.rows li{display:flex;gap:12px;align-items:flex-start}
.rows li>svg{flex:none;margin-top:5px;color:var(--accent)}
.rows li>span{min-width:0}

/* biaya */
.fees{border-top:1px solid var(--line);max-width:760px}
.fee{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.fee .fn{font-weight:600}
.fee .fv{font-weight:700;color:var(--accent);text-align:right}
.fee .fo{grid-column:1/-1;color:var(--muted);font-size:14px}

/* status ketentuan */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--accent);border-color:var(--accent)}
.chip.tbd{border-style:dashed}
.pols{display:grid;gap:14px;max-width:760px}
.pol{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pol.tbd{border-style:dashed;background:transparent}
.polh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.pol .pi,.pol .ut{font-size:15px;max-width:640px}

/* kalkulator */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 32px;align-items:start}
.cin,.cout{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.cin{display:flex;flex-direction:column;gap:20px}
.cin .fld label{display:flex;justify-content:space-between;gap:12px}
.cin .fld label b{color:var(--accent);font-weight:700;white-space:nowrap}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.big{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.big b{display:block;margin-top:4px;font:700 40px/1.05 var(--display);color:var(--accent)}
.big span{color:var(--muted);font-size:14px}
.res h4{font:600 16px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.rr{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:5px 0;font-size:15px}
.rr span{min-width:0;color:var(--muted)}
.rr b{font-weight:600;text-align:right;white-space:nowrap}
.rr.tot span{color:var(--text);font-weight:600}
.rr.tot b{font-weight:700}

/* FAQ */
.faq{border-top:1px solid var(--line);max-width:760px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;padding:12px 0;font-weight:600;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font:500 28px/1 var(--display);color:var(--accent)}
.faq details[open] summary::after{content:"–"}
.faq .ans{padding:0 0 18px;color:var(--muted);max-width:640px}
.faq .ans .btn{margin-top:12px}

/* data pengelola */
.idl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:10px 24px;max-width:760px;font-size:15px}
.idl dt{color:var(--muted)}
.idl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.idl dd.na{font-weight:400;color:var(--muted)}
@media (max-width:480px){.idl{grid-template-columns:minmax(0,1fr);gap:2px}.idl dd{margin-bottom:10px}}

/* footer situs */

  /* biaya & simulasi */
  var CALC = { contrib: 75, trips: 0, varm: 0, sale: 70 };
  function fee(name, val, note) { return '<div class="fee"><div class="fn">' + esc(name) + '</div><div class="fv">' + tok(val) + '</div>' + (note ? '<div class="fo">' + tok(note) + '</div>' : '') + '</div>'; }
  function calcCompute() {
    var c = CALC.contrib * 1e6, pool = c * SLOTS, dp = c * (Number(S.settings.dp) || 0) / 100;
    var iuran = 250000 * 60, antar = 100000 * CALC.trips * 5, vr = CALC.varm * 60;
    var out = c + iuran + antar + vr;
    var unit = pool / 1.1, margin = pool - unit;
    var sale = unit * CALC.sale / 100, fe = sale * 0.1, per = (sale - fe) / SLOTS, cost = out - per;
    var tier = S.tiers.filter(function (t) { return pool / 1e6 >= t.min && pool / 1e6 <= t.max; })[0];
    return { c: c, pool: pool, unit: unit, margin: margin, dp: dp, iuran: iuran, antar: antar, vr: vr, out: out, sale: sale, fe: fe, per: per, cost: cost, month: cost / 60, tier: tier };
  }
  function rr(a, b, cls) { return '<div class="rr' + (cls ? ' ' + cls : '') + '"><span>' + a + '</span><b>' + b + '</b></div>'; }

      rr('Total dana unit (6 anggota)', idr(r.pool)) +
      rr('Margin beli pengelola 10% (sudah termasuk)', idr(r.margin)) +
      rr('Harga unit setelah margin', idr(r.unit)) +
      rr('Setara range harga', r.tier ? esc(r.tier.name) : '–') +
      rr('DP sekitar ' + esc(S.settings.dp) + '% dari kontribusi', idr(r.dp)) +
      '<h4>Pengeluaran per anggota, 5 tahun</h4>' +
      rr('Kontribusi pembelian (termasuk DP)', idr(r.c)) +
      rr('Iuran rutin, 60 × Rp250.000', idr(r.iuran)) +
      rr('Antar-jemput, ' + (CALC.trips * 5) + ' trip × Rp100.000', idr(r.antar)) +
      rr('Biaya variabel (perkiraan Anda), 60 bulan', idr(r.vr)) +
      rr('Total pengeluaran', idr(r.out), 'tot') +
      '<h4>Di akhir kontrak (asumsi)</h4>' +

  function calcVals() { return { contrib: idr(CALC.contrib * 1e6), trips: CALC.trips + ' trip', varm: idr(CALC.varm), sale: CALC.sale + '%' }; }
  function calcUpdate() {
    var o = document.getElementById('calc-out'); if (o) o.innerHTML = calcRows();

  });

  function formDlg(cfg) {
    var h = '<form class="frm" novalidate><div class="dh"><h2 id="dt" style="font:600 28px/1.1 var(--display);text-transform:none;letter-spacing:0">' + esc(cfg.title) + '</h2><button type="button" class="x" data-dlg="close" aria-label="Tutup">' + X_ICON + '</button></div><div class="fgrid">';
    cfg.fields.forEach(function (f) {
      var id = 'f-' + f.k, v = cfg.values[f.k]; if (v == null || (typeof v === 'number' && isNaN(v))) v = '';
      h += '<div class="fld' + (f.wide ? ' wide' : '') + '"><label for="' + id + '">' + esc(f.l) + '</label>';
      if (f.t === 'select') {
        h += '<select id="' + id + '">' + f.o.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
      } else if (f.t === 'img') {
        h += '<div class="imgprev"><input id="' + id + '" type="file" accept="image/png,image/jpeg,image/webp"><div id="prev-' + f.k + '"></div><button type="button" class="btn sm" id="clr-' + f.k + '" hidden>Hapus gambar</button></div>';
      } else if (f.t === 'area') {
        h += '<textarea id="' + id + '" rows="' + (f.rows || 3) + '"' + (f.max ? ' maxlength="' + f.max + '"' : '') + '>' + esc(v) + '</textarea>';
      } else {
        h += '<input id="' + id + '" type="' + (f.t === 'num' ? 'number' : 'text') + '" value="' + esc(v) + '"' + (f.max ? ' maxlength="' + f.max + '"' : '') + (f.t === 'num' ? ' inputmode="decimal" step="any"' : '') + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + ' autocomplete="off">';
      }
      if (f.h) h += '<small>' + esc(f.h) + '</small>';
      h += '</div>';
    });
    h += '</div><p class="err" id="ferr" role="alert" hidden></p><div class="frow">';
    if (cfg.del) h += '<button type="button" class="btn danger" id="fdel">' + esc(cfg.del) + '</button>';
    h += '<span class="sp"></span><button type="button" class="btn" data-dlg="close">Batal</button><button type="submit" class="btn primary">' + esc(cfg.ok || 'Simpan') + '</button></div></form>';
    openDlg(h, 'narrow');
    var form = dlg.querySelector('form'), err = dlg.querySelector('#ferr');
    function fail(m) { err.textContent = m; err.hidden = false; }
    var imgs = {};
    cfg.fields.forEach(function (fl) {
      if (fl.t !== 'img') return;
      imgs[fl.k] = cfg.values[fl.k] || '';
      var inp = dlg.querySelector('#f-' + fl.k), prev = dlg.querySelector('#prev-' + fl.k), clr = dlg.querySelector('#clr-' + fl.k);
      function show() {
        prev.innerHTML = imgs[fl.k] ? '<img class="mimg" src="' + esc(imgs[fl.k]) + '" alt="Pratinjau gambar">' : '<span class="muted" style="font-size:13px">Belum ada gambar. Dipakai ilustrasi vektor.</span>';
        clr.hidden = !imgs[fl.k];
      }
      show();
      inp.addEventListener('change', function () {
        var f0 = inp.files && inp.files[0]; if (!f0) return;
        readImage(f0).then(function (u) { imgs[fl.k] = u; show(); err.hidden = true; }, function (m) { fail(typeof m === 'string' ? m : 'Gambar tidak bisa diproses.'); });
        inp.value = '';
      });
      clr.addEventListener('click', function () { imgs[fl.k] = ''; show(); });
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var vals = {};
      cfg.fields.forEach(function (fl) {
        if (fl.t === 'img') { vals[fl.k] = imgs[fl.k] || ''; return; }
        var v = dlg.querySelector('#f-' + fl.k).value.trim(); vals[fl.k] = fl.t === 'num' ? (v === '' ? NaN : Number(v)) : v;
      });
      var m = cfg.save(vals);
      if (m) fail(m); else { closeDlg(); changed(); }
    });
    if (cfg.del) {
      var b = dlg.querySelector('#fdel'), armed = false;
      b.addEventListener('click', function () {

        var m = cfg.onDel();
        if (m) { armed = false; b.textContent = cfg.del; fail(m); } else { closeDlg(); changed(); }
      });
    }
    var first = (cfg.focus && dlg.querySelector('#f-' + cfg.focus)) || dlg.querySelector('input,select,textarea'); if (first) first.focus();
  }

  function tierDlg(id) {
    var t = id ? tierOf(id) : { name: '', min: '', max: '' };
    formDlg({
      title: id ? 'Ubah tier' : 'Tambah tier', values: t, del: id ? 'Hapus tier' : '',
      fields: [
        { k: 'name', l: 'Nama tier', max: 24, wide: true },
        { k: 'min', l: 'Total dana minimum (juta Rp)', t: 'num' },
        { k: 'max', l: 'Total dana maksimum (juta Rp)', t: 'num' }
      ],
      save: function (v) {
        if (!v.name) return 'Nama tier wajib diisi.';
        if (bad(v.min) || bad(v.max) || v.min < 0 || v.min >= v.max) return 'Range dana tidak valid: minimum harus lebih kecil dari maksimum.';
        if (id) {
          var out = S.models.filter(function (m) { return m.tier === id && (m.fmin < v.min || m.fmax > v.max); });
          if (out.length) return 'Range baru tidak mencakup model: ' + out.map(function (m) { return m.name; }).join(', ') + '. Ubah model itu dulu.';
          t.name = v.name; t.min = v.min; t.max = v.max;
        } else {
          var nt = { id: uid('t'), name: v.name, min: v.min, max: v.max };
          S.tiers.push(nt); S.tiers.sort(function (a, b) { return a.min - b.min; }); UI.tier = nt.id; UI.brand = 'all';
        }
      },
      onDel: function () {
        if (S.models.some(function (m) { return m.tier === id; })) return 'Tier masih punya model. Pindahkan atau hapus modelnya dulu.';
        S.tiers = S.tiers.filter(function (x) { return x.id !== id; });

      },
      onDel: function () {
        if (S.models.some(function (m) { return m.brand === id; })) return 'Merek masih punya model. Hapus modelnya dulu.';
        S.brands = S.brands.filter(function (x) { return x.id !== id; }); UI.brand = 'all';
      }
    });
  }
  function modelDlg(id) {
    if (!S.brands.length || !S.tiers.length) { toast('Tambahkan tier dan merek dulu sebelum membuat model.'); return; }
    var m = id ? modelOf(id) : { name: '', family: '', cc: '', y1: '', y2: '', fmin: '', fmax: '', body: 'cruiser', paint: '#C8402F', img: '', tier: UI.tier, brand: UI.brand !== 'all' ? UI.brand : S.brands[0].id };
    formDlg({
      title: id ? 'Ubah model' : 'Tambah model', values: m, del: id ? 'Hapus model' : '',
      fields: [
        { k: 'name', l: 'Nama model', max: 40, wide: true },
        { k: 'brand', l: 'Merek', t: 'select', o: S.brands.map(function (b) { return [b.id, b.name]; }) },
        { k: 'tier', l: 'Range harga', t: 'select', o: S.tiers.map(function (t) { return [t.id, t.name + ' (' + rp(t.min, t.max) + ')']; }) },
        { k: 'family', l: 'Seri / keluarga', max: 30 },
        { k: 'cc', l: 'Kapasitas mesin (cc)', t: 'num' },
        { k: 'y1', l: 'Tahun pembuatan dari', t: 'num' },
        { k: 'y2', l: 'Tahun pembuatan sampai', t: 'num' },
        { k: 'fmin', l: 'Target dana minimum (juta Rp)', t: 'num' },
        { k: 'fmax', l: 'Target dana maksimum (juta Rp)', t: 'num' },
        { k: 'body', l: 'Gaya ilustrasi', t: 'select', o: BODIES },
        { k: 'paint', l: 'Warna ilustrasi', t: 'select', o: PAINTS },
        { k: 'img', l: 'Gambar ilustrasi (opsional)', t: 'img', wide: true, h: 'Unggah foto atau gambar milik Anda atau yang berlisensi. Jika kosong, dipakai ilustrasi vektor di atas.' }
      ],
      save: function (v) {
        if (!v.name) return 'Nama model wajib diisi.';
        if (bad(v.cc) || v.cc <= 0) return 'Kapasitas mesin tidak valid.';
        if (bad(v.y1) || bad(v.y2) || v.y1 < 1990 || v.y2 > 2035 || v.y1 > v.y2) return 'Rentang tahun tidak valid (contoh 2018 sampai 2022).';
        if (bad(v.fmin) || bad(v.fmax) || v.fmin > v.fmax) return 'Range dana tidak valid: minimum tidak boleh lebih besar dari maksimum.';
        var t = tierOf(v.tier);
        if (v.fmin < t.min || v.fmax > t.max) return 'Range dana harus berada di dalam tier ' + t.name + ' (' + rp(t.min, t.max) + ').';
        var rec = { name: v.name, family: v.family, cc: v.cc, y1: v.y1, y2: v.y2, fmin: v.fmin, fmax: v.fmax, body: v.body, paint: v.paint, img: v.img, tier: v.tier, brand: v.brand };
        if (id) { Object.keys(rec).forEach(function (k) { m[k] = rec[k]; }); }
        else { rec.id = uid('m'); S.models.push(rec); }
        UI.tier = v.tier; UI.brand = v.brand;
      },
      onDel: function () {
        S.models = S.models.filter(function (x) { return x.id !== id; });
        S.members = S.members.filter(function (x) { return x.model !== id; });
      }
    });
  }
  function memberDlg(modelId, mid) {
    var mm = mid ? S.members.filter(function (x) { return x.id === mid; })[0] : null;
    var model = modelOf(modelId);
    formDlg({
      title: (mm ? 'Ubah anggota' : 'Tambah anggota') + ' · ' + model.name,
      values: mm ? { ini: mm.ini, st: mm.st } : { ini: '', st: 'daftar' }, del: mm ? 'Hapus dari slot' : '',
      fields: [
        { k: 'ini', l: 'Inisial', max: 3, ph: 'RA', h: 'Maksimal 3 huruf. Jangan isi nama lengkap, hanya inisial.' },
        { k: 'st', l: 'Status', t: 'select', o: [['daftar', 'Mendaftar'], ['verifikasi', 'Terverifikasi'], ['dp', 'DP terbayar']] }
      ],
      save: function (v) {
        var ini = v.ini.toUpperCase();
        if (!/^\p{L}{1,3}$/u.test(ini)) return 'Inisial harus 1–3 huruf.';
        if (mm) { mm.ini = ini; mm.st = v.st; }
        else {
          if (membersOf(modelId).length >= SLOTS) return 'Semua 6 slot model ini sudah terisi.';
          S.members.push({ id: uid('a'), model: modelId, ini: ini, st: v.st });
        }
      },
      onDel: function () { S.members = S.members.filter(function (x) { return x.id !== mid; }); }
    });
  }

  function companyDlg() {
    formDlg({
      title: 'Info pengelola', values: S.site.company,
      fields: [
        { k: 'name', l: 'Nama badan usaha', max: 80, wide: true },
        { k: 'nib', l: 'NIB', max: 30, h: 'Kosongkan jika belum ingin ditampilkan.' },
        { k: 'email', l: 'Email', max: 80 },
        { k: 'address', l: 'Alamat', t: 'area', rows: 3, max: 300, wide: true },
        { k: 'hours', l: 'Jam layanan', max: 80, ph: 'Senin–Jumat, 09.00–17.00 WIB', wide: true }
      ],
      save: function (v) {
        if (!v.name) return 'Nama badan usaha wajib diisi.';
        if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return 'Format email tidak valid.';
        S.site.company = { name: v.name, nib: v.nib, address: v.address, email: v.email, hours: v.hours };
      }
    });
  }
  function founderDlg() {
    formDlg({
      title: 'Profil pendiri', values: S.site.founder,
      fields: [
        { k: 'name', l: 'Nama', max: 60, h: 'Kosongkan jika tidak ingin menampilkan nama.' },
        { k: 'role', l: 'Jabatan', max: 60, ph: 'Pendiri' },
        { k: 'photo', l: 'Foto', t: 'img', wide: true, h: 'Pakai foto Anda sendiri. Gambar dikecilkan otomatis dan paling pas berbentuk potret (4:5).' },
        { k: 'quote', l: 'Kutipan pembuka', t: 'area', rows: 2, max: 160, wide: true },
        { k: 'story', l: 'Kisah singkat', t: 'area', rows: 12, max: 1800, wide: true, h: 'Pisahkan paragraf dengan baris kosong.' }
      ],
      save: function (v) { S.site.founder = { name: v.name, role: v.role, photo: v.photo, quote: v.quote, story: v.story }; }
    });
  }
  function policyDlg(key) {
    formDlg({
      title: 'Ketentuan', values: S.site.policy, focus: key || '',
      fields: POL.map(function (p) { return { k: p.k, l: p.l, t: 'area', rows: 4, max: 900, wide: true, h: p.h + ' Kosongkan jika belum final.' }; }),
      save: function (v) { POL.forEach(function (p) { S.site.policy[p.k] = v[p.k]; }); }
    });
  }
  function faqDlg(id) {
    var f = id ? S.site.faq.filter(function (x) { return x.id === id; })[0] : { q: '', a: '' };
    if (!f) return;
    formDlg({
      title: id ? 'Ubah pertanyaan' : 'Tambah pertanyaan', values: f, del: id ? 'Hapus pertanyaan' : '',
      fields: [
        { k: 'q', l: 'Pertanyaan', max: 160, wide: true },
        { k: 'a', l: 'Jawaban', t: 'area', rows: 6, max: 900, wide: true, h: 'Boleh memakai {perusahaan} dan {dp}, diganti otomatis. Tautan antarhalaman: [[#biaya|Biaya]].' }
      ],
      save: function (v) {
        if (!v.q) return 'Pertanyaan wajib diisi.';
        if (!v.a) return 'Jawaban wajib diisi.';
        if (id) { f.q = v.q; f.a = v.a; } else { S.site.faq.push({ id: uid('q'), q: v.q, a: v.a }); }
      },
      onDel: function () { S.site.faq = S.site.faq.filter(function (x) { return x.id !== id; }); }
    });
  }

  /* ---------- rincian model ---------- */
  function waLink(m) {
    var n = (S.settings.whatsapp || '').replace(/\D/g, ''); if (!n) return '';
    var msg = 'Halo, saya ingin mendaftar sebagai anggota untuk ' + brandOf(m.brand).name + ' ' + m.name + ' (tier ' + tierOf(m.tier).name + '). Mohon info langkah verifikasi.';
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg);
  }
  function openDetail(id) {
    var m = modelOf(id); if (!m) return;
    var t = tierOf(m.tier), b = brandOf(m.brand), full = membersOf(id).length >= SLOTS, link = waLink(m);
    var reg = !link ? '<button type="button" class="btn" disabled>Pendaftaran segera dibuka</button>' :
      (full ? '<button type="button" class="btn" disabled>Semua slot terisi</button>' : '<a class="btn primary" href="' + esc(link) + '" target="_blank" rel="noopener">Daftar via WhatsApp</a>');
    var wa = S.settings.whatsapp ? '<p class="muted" style="font-size:13px;margin-top:10px">Atau hubungi WhatsApp <span style="user-select:all">+' + esc(S.settings.whatsapp) + '</span></p>' : '';
    var h = '<div class="dt"><div class="l"><div class="stage' + (m.img ? ' ph' : '') + '" style="background:none;' + (m.img ? '' : 'padding:28px 0 0') + '"><span class="tag"' + (m.img ? '' : ' style="left:0"') + '>Ilustrasi</span>' + pic(m) + '</div>' +
      '<p class="muted" style="font-size:13px">Ilustrasi gaya motor. Unit aktual dicarikan setelah dana terkumpul; warna dan varian dapat berbeda.</p></div>' +
      '<div class="r"><div class="dh"><div><div class="mt">' + esc(b.name) + ' · ' + esc(m.family) + '</div><h2 id="dt">' + esc(m.name) + '</h2><div class="tr">' + esc(t.name) + ' · ' + rp(t.min, t.max) + '</div></div><button type="button" class="x" data-dlg="close" aria-label="Tutup rincian">' + X_ICON + '</button></div>' +
      '<dl class="kv" style="margin-top:22px;padding-bottom:20px;border-bottom:1px solid var(--line)"><dt>Tahun pembuatan</dt><dd>' + esc(m.y1) + '–' + esc(m.y2) + '</dd><dt>Kapasitas mesin</dt><dd>' + esc(m.cc) + ' cc</dd><dt>Target dana unit</dt><dd>' + rp(m.fmin, m.fmax) + '</dd><dt>Per anggota (1/6)</dt><dd class="ac">' + per(m.fmin, m.fmax) + '</dd><dt>Durasi kontrak</dt><dd>5 tahun</dd></dl>' +
      '<h3>Slot anggota</h3><div class="sl"><div class="lb"><span>' + summary(id) + '</span></div>' + slotsHtml(id, false) + '</div>' + legend() +
      '<div class="box"><b>Uang muka (DP) sekitar ' + esc(S.settings.dp) + '%</b>Saat ini yang dikumpulkan hanya DP untuk mengamankan slot, bukan pelunasan.' + (S.settings.dpNote ? '<br>' + esc(S.settings.dpNote) : '') + '</div>' +
      '<h3>Biaya berjalan per anggota</h3><dl class="kv sm"><dt>Iuran rutin (manajemen + garasi)</dt><dd>Rp250.000 / bulan</dd><dt>Antar-jemput, opsional</dt><dd>Rp100.000 / trip</dd><dt>BBM, tol, perbaikan di luar garansi</dt><dd>Ditagih terpisah</dd></dl>' +
      '<h3>Biaya pengelola</h3><dl class="kv sm"><dt>Margin pembelian, sudah termasuk kontribusi</dt><dd>10% dari harga unit</dd><dt>Komisi jual saat likuidasi, tahun ke-5</dt><dd>10% dari harga jual</dd></dl>' +
      '<div class="btns">' + reg + (UI.admin ? '<button type="button" class="btn" data-act="model-edit" data-id="' + esc(id) + '">Ubah model</button>' : '') + '<button type="button" class="btn" data-dlg="close">Tutup</button></div>' + wa + '</div></div>';
    openDlg(h, '');
  }

  /* ---------- terbitkan ---------- */
  function buildDoc() {
    var st = document.head.querySelector('style');
    var reset = st && /\[hidden\]/.test(st.textContent) ? st.textContent : FALLBACK_RESET;
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('appjs').textContent;
    var content = '<title>' + TITLE + '</title><meta name="claude:viewport-fit-sides" content="cover">' +
      '<link rel="stylesheet" href="' + FONT + '"><style id="css">' + css + '</style>' +
      '<div id="app"></div><dialog id="dlg"></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>' +
      '<script type="application/json" id="state">' + json + '<' + '/script><script id="appjs">' + js + '<' + '/script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + content + '</body></html>';
  }
  function downloadDoc() {
    try {
      var doc = buildDoc().replace('<html>', '<html lang="id">');
      var blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'index.html'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
      UI.dirty = 0; UI.saved = true; render();
      toast('index.html diunduh. Timpa file lama di repo dengan file ini, lalu commit dan push.');
    } catch (e) { toast('Gagal mengunduh file. Coba lagi.'); }
  }
  function publish() {
    if (UI.saving || !UI.dirty) return;
    use('artifact').then(function (art) {
      if (!art) { if (UI.local) downloadDoc(); else toast('Penyimpanan tidak tersedia di tampilan ini. Buka halaman dari akun pengelola.'); return; }
      var doc = buildDoc();
      if (doc.length > 12000000) { toast('Halaman terlalu besar (' + Math.round(doc.length / 1e6) + ' MB). Hapus beberapa gambar lalu coba lagi.'); return; }
      UI.saving = true; stash(); render();
      return art.publish(doc).catch(function (e) {
        UI.saving = false;
        var c = e && e.code;
        if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'not_declared') { UI.canEdit = false; UI.admin = false; toast('Akun ini hanya bisa melihat halaman. Perubahan tidak tersimpan.'); }
        else if (c === 'conflict') toast('Ada versi yang lebih baru. Halaman dimuat ulang dan perubahan terakhir Anda perlu diulang.');
        else if (c === 'too_large') toast('Halaman terlalu besar untuk disimpan.');
        else if (c === 'rate_limited') toast('Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.');
        else toast('Gagal menerbitkan. Coba lagi sebentar.');
        render();
      });
    });
  }

  /* ---------- aksi ---------- */
  function act(a, d) {
    switch (a) {
      case 'tier': UI.tier = d.id; UI.brand = 'all'; render(); break;
      case 'brand': UI.brand = d.id; render(); break;
      case 'open': openDetail(d.id); break;
      case 'admin': UI.admin = !UI.admin; stash(); render(); break;
      case 'publish': publish(); break;
      case 'discard': try { sessionStorage.setItem('kt-admin', '1'); } catch (e) {} location.reload(); break;
      case 'settings': settingsDlg(); break;
      case 'tier-add': tierDlg(null); break;
      case 'tier-edit': tierDlg(d.id); break;
      case 'brand-add': brandDlg(null); break;
      case 'brand-edit': brandDlg(d.id); break;
      case 'model-add': modelDlg(null); break;
      case 'model-edit': modelDlg(d.id); break;
      case 'slot': memberDlg(d.id, d.mid || null); break;
      case 'scroll': { var tg = document.getElementById(d.to); if (tg) { var rm = false; try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {} tg.scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block: 'start' }); } break; }
      case 'company': companyDlg(); break;
      case 'founder': founderDlg(); break;
      case 'policy': policyDlg(d.key || ''); break;
      case 'faq-add': faqDlg(null); break;
      case 'faq-edit': faqDlg(d.id); break;
    }
  }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    UI.focus = t.getAttribute('data-fk') || null;
    act(t.getAttribute('data-act'), t.dataset);
  });

  /* ---------- mulai ---------- */
  try { if (location.hash === '#kelola') UI.canEdit = true; } catch (e) {}
  try { if (UI.canEdit && sessionStorage.getItem('kt-admin') === '1') UI.admin = true; } catch (e) {}
  ensureSite();
  render();
  use('user').then(function (u) { return u ? u.canEdit() : false; }).then(function (ok) {
    if (ok) UI.canEdit = true;
    if (UI.canEdit) { try { UI.admin = sessionStorage.getItem('kt-admin') === '1'; } catch (e) {} render(); }
  }).catch(function () {});
  window.addEventListener('hashchange', function () {
    if (dlg.open) closeDlg();
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
    var h1 = app.querySelector('h1'); if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) {} }
  });
  app.addEventListener('input', function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute('data-calc');
    if (!k) return;
    CALC[k] = Number(e.target.value); calcUpdate();
  });
})();
</script>
